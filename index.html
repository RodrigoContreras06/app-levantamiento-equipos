<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Levantamiento de Activos SAP</title>
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#0f172a" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

<style>
    :root {
      --bg: #050914;
      --panel: rgba(11, 20, 38, 0.88);
      --panel-hover: rgba(18, 36, 66, 0.95);
      --border: rgba(56, 189, 248, 0.28);
      --text: #e6f1ff;
      --muted: #7f9bb8;
      --accent: #00e5ff;
      --accent-2: #7c3aed;
      --ut-color: #ffb800;
      --eq-color: #00f5a0;
      --subeq-color: #c084fc;
      --create-color: #ff2a85;
      --ok-bg: rgba(0, 245, 160, 0.12);
      --err-bg: rgba(255, 59, 92, 0.14);
      --glow: 0 0 14px rgba(0, 229, 255, 0.18);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }

    body {
      background-color: var(--bg);
      background-image:
        radial-gradient(circle at 15% 10%, rgba(0, 229, 255, 0.08), transparent 40%),
        radial-gradient(circle at 85% 85%, rgba(124, 58, 237, 0.08), transparent 45%),
        linear-gradient(rgba(0, 229, 255, 0.035) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0, 229, 255, 0.035) 1px, transparent 1px);
      background-size: 100% 100%, 100% 100%, 28px 28px, 28px 28px;
      color: var(--text);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    body.mobile-detail-active header { display: none; }

    /* Barra superior HUD */
    header {
      background: linear-gradient(180deg, rgba(10, 19, 36, 0.96), rgba(7, 13, 25, 0.92));
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border);
      box-shadow: 0 4px 24px rgba(0, 0, 0, 0.55);
      padding: 8px 12px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      flex-shrink: 0;
    }

    .header-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 6px;
    }

    .title-group { display: flex; align-items: center; gap: 7px; flex-wrap: wrap; }
    header h1 {
      font-size: 0.98rem;
      font-weight: 800;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      color: var(--accent);
      text-shadow: 0 0 12px rgba(0, 229, 255, 0.35);
    }

    .status-pill {
      font-size: 0.68rem;
      font-weight: 700;
      letter-spacing: 0.4px;
      padding: 2px 8px;
      border-radius: 999px;
      background: rgba(0, 245, 160, 0.12);
      color: var(--eq-color);
      border: 1px solid rgba(0, 245, 160, 0.35);
      box-shadow: 0 0 10px rgba(0, 245, 160, 0.15);
    }
    .status-pill.offline {
      background: rgba(255, 184, 0, 0.14);
      color: var(--ut-color);
      border-color: rgba(255, 184, 0, 0.4);
      box-shadow: none;
    }

    .station-select {
      background: rgba(5, 11, 22, 0.9);
      border: 1px solid var(--ut-color);
      color: #ffd15c;
      font-weight: 700;
      padding: 5px 9px;
      border-radius: 6px;
      font-size: 0.82rem;
      max-width: 245px;
      box-shadow: 0 0 10px rgba(255, 184, 0, 0.15);
    }

    /* Barra de progreso energética */
    .progress-wrapper { display: flex; align-items: center; gap: 8px; font-size: 0.75rem; color: var(--muted); }
    .progress-bar {
      flex: 1;
      height: 8px;
      background: rgba(4, 9, 18, 0.9);
      border-radius: 999px;
      overflow: hidden;
      border: 1px solid rgba(0, 229, 255, 0.25);
    }
    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, #00e5ff, #00f5a0);
      box-shadow: 0 0 12px rgba(0, 229, 255, 0.6);
      width: 0%;
      transition: width 0.35s ease;
    }

    .search-row { display: flex; gap: 6px; align-items: center; }

    .search-box {
      flex: 1;
      min-width: 160px;
      background: rgba(5, 11, 22, 0.88);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 0.83rem;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .search-box:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: var(--glow);
    }

    .toggle-filters-btn { display: none; }

    .controls-bar {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      align-items: center;
    }

    select, button, input[type="text"].inspector-input {
      background: rgba(7, 15, 30, 0.9);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 6px 9px;
      border-radius: 6px;
      font-size: 0.78rem;
      cursor: pointer;
      transition: all 0.18s ease;
    }
    select.ut-select { max-width: 230px; }
    input[type="text"].inspector-input { width: 95px; cursor: text; }

    button:hover, select:hover {
      background: var(--panel-hover);
      border-color: rgba(0, 229, 255, 0.55);
    }
    button.primary {
      background: linear-gradient(135deg, #00e5ff, #0284c7);
      color: #03101d;
      font-weight: 800;
      border: none;
      box-shadow: 0 0 12px rgba(0, 229, 255, 0.28);
    }
    button.export-btn {
      background: linear-gradient(135deg, #00f5a0, #059669);
      color: #031710;
      font-weight: 800;
      border: none;
      box-shadow: 0 0 12px rgba(0, 245, 160, 0.25);
    }
    button.create-btn {
      background: rgba(255, 42, 133, 0.14);
      border: 1px solid rgba(255, 42, 133, 0.55);
      color: #ff77b2;
      font-weight: 700;
    }
    button.create-btn:hover { background: rgba(255, 42, 133, 0.26); }

    main { display: flex; flex: 1; overflow: hidden; position: relative; }

    /* Árbol izquierdo */
    #tree-container {
      width: 50%;
      border-right: 1px solid var(--border);
      overflow-y: auto;
      padding: 10px 12px;
    }

    .node { margin-left: 15px; border-left: 1px dashed rgba(0, 229, 255, 0.25); padding-left: 6px; }
    .node-root { margin-left: 0; border-left: none; padding-left: 0; }

    .node-row {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 7px 8px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.84rem;
      user-select: none;
      margin-bottom: 2px;
      border: 1px solid transparent;
      transition: all 0.15s ease;
    }
    .node-row:hover {
      background: var(--panel-hover);
      border-color: rgba(0, 229, 255, 0.22);
    }
    .node-row.selected {
      background: rgba(0, 229, 255, 0.14);
      border-color: var(--accent);
      box-shadow: var(--glow);
    }
    .node-row.status-levantado { background: var(--ok-bg); border-color: rgba(0, 245, 160, 0.35); }
    .node-row.status-no-encontrado { background: var(--err-bg); border-color: rgba(255, 59, 92, 0.35); }

    .toggle {
      width: 20px;
      height: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--accent);
      font-size: 0.78rem;
      flex-shrink: 0;
      border-radius: 4px;
    }
    .toggle:hover { background: rgba(0, 229, 255, 0.14); }
    .status-dot { width: 16px; text-align: center; font-weight: bold; font-size: 0.84rem; flex-shrink: 0; }

    .badge {
      font-size: 0.64rem;
      letter-spacing: 0.5px;
      padding: 2px 6px;
      border-radius: 4px;
      font-weight: 700;
      text-transform: uppercase;
      flex-shrink: 0;
    }
    .badge-ut { background: rgba(255, 184, 0, 0.14); color: var(--ut-color); border: 1px solid rgba(255, 184, 0, 0.3); }
    .badge-eq { background: rgba(0, 245, 160, 0.14); color: var(--eq-color); border: 1px solid rgba(0, 245, 160, 0.3); }
    .badge-sub { background: rgba(192, 132, 252, 0.14); color: var(--subeq-color); border: 1px solid rgba(192, 132, 252, 0.3); }
    .badge-new { background: rgba(255, 42, 133, 0.18); color: #ff77b2; border: 1px solid rgba(255, 42, 133, 0.35); }

    .code { font-family: 'Consolas', 'Courier New', monospace; font-weight: 700; color: #f0f9ff; flex-shrink: 0; }
    .desc { color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; }
    .ut-info-btn {
      padding: 2px 7px;
      font-size: 0.7rem;
      background: rgba(0, 229, 255, 0.08);
      border: 1px solid rgba(0, 229, 255, 0.3);
      color: var(--accent);
      border-radius: 4px;
      flex-shrink: 0;
    }
    .children { display: none; }
    .children.open { display: block; }

    /* Panel derecho */
    #detail-container {
      width: 50%;
      overflow-y: auto;
      padding: 16px;
      background: rgba(7, 14, 28, 0.65);
    }

    .mobile-back-btn {
      display: none;
      margin-bottom: 12px;
      background: var(--panel);
      border: 1px solid var(--accent);
      color: var(--accent);
      padding: 11px 14px;
      font-weight: 700;
      width: 100%;
      text-align: left;
      border-radius: 8px;
      font-size: 0.9rem;
      box-shadow: var(--glow);
    }

    .empty-state { color: var(--muted); text-align: center; margin-top: 18%; font-size: 0.9rem; padding: 0 20px; line-height: 1.5; }
    .detail-header { border-bottom: 1px solid var(--border); padding-bottom: 10px; margin-bottom: 14px; }
    .detail-title { font-size: 1.12rem; margin: 6px 0 4px; font-weight: 700; }
    .detail-code { font-family: monospace; color: var(--accent); font-size: 0.92rem; display: flex; align-items: center; gap: 8px; }

    .field-capture-box {
      background: var(--panel);
      border: 1px solid var(--border);
      box-shadow: var(--glow);
      border-radius: 10px;
      padding: 13px;
      margin-bottom: 16px;
    }
    .field-capture-box h3 {
      font-size: 0.88rem;
      color: var(--accent);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 10px;
      display: flex;
      justify-content: space-between;
    }

    .action-buttons { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 12px; }
    .btn-check {
      padding: 12px;
      font-size: 0.88rem;
      font-weight: 700;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: rgba(5, 11, 22, 0.85);
      color: var(--text);
      transition: all 0.2s;
    }
    .btn-check.active-ok {
      background: linear-gradient(135deg, #00f5a0, #10b981);
      color: #031710;
      border-color: #00f5a0;
      box-shadow: 0 0 14px rgba(0, 245, 160, 0.35);
    }
    .btn-check.active-err {
      background: linear-gradient(135deg, #ff3b5c, #dc2626);
      color: #fff;
      border-color: #ff3b5c;
      box-shadow: 0 0 14px rgba(255, 59, 92, 0.35);
    }

    .meta-stamp { font-size: 0.76rem; color: var(--eq-color); margin-bottom: 10px; }
    .meta-stamp.err { color: #ff6b81; }

    .photo-controls { display: flex; gap: 8px; margin-bottom: 10px; }
    .photo-btn {
      flex: 1;
      background: rgba(5, 11, 22, 0.85);
      border: 1px dashed rgba(0, 229, 255, 0.55);
      color: var(--accent);
      padding: 10px;
      border-radius: 8px;
      text-align: center;
      font-size: 0.84rem;
      font-weight: 600;
      cursor: pointer;
    }
    .photo-btn:hover { background: rgba(0, 229, 255, 0.08); }

    .photo-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(82px, 1fr)); gap: 8px; margin-bottom: 12px; }
    .photo-thumb {
      position: relative;
      aspect-ratio: 1;
      border-radius: 8px;
      overflow: hidden;
      border: 1px solid var(--border);
    }
    .photo-thumb img { width: 100%; height: 100%; object-fit: cover; }
    .photo-del {
      position: absolute;
      top: 4px;
      right: 4px;
      background: rgba(239, 68, 68, 0.92);
      color: white;
      border: none;
      border-radius: 50%;
      width: 22px;
      height: 22px;
      font-size: 0.75rem;
      padding: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    textarea.obs-input, input.form-input {
      width: 100%;
      background: rgba(5, 11, 22, 0.88);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 9px 10px;
      border-radius: 6px;
      font-size: 0.86rem;
      margin-bottom: 10px;
    }
    textarea.obs-input { min-height: 75px; resize: vertical; }
    textarea.obs-input:focus, input.form-input:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: var(--glow);
    }

    .form-label { display: block; font-size: 0.76rem; color: var(--muted); margin-bottom: 4px; font-weight: 600; }

    .grid-specs { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .spec-card {
      background: var(--panel);
      border: 1px solid rgba(0, 229, 255, 0.18);
      padding: 8px 10px;
      border-radius: 8px;
    }
    .spec-label { font-size: 0.68rem; color: var(--muted); margin-bottom: 2px; }
    .spec-value { font-size: 0.82rem; font-weight: 500; word-break: break-word; }

    .creation-card {
      background: var(--panel);
      border: 1px solid rgba(255, 42, 133, 0.45);
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 10px;
      cursor: pointer;
    }
    .creation-card:hover { background: var(--panel-hover); }

    .loader { padding: 20px; color: var(--accent); font-size: 0.9rem; }

    @media (max-width: 820px) {
      #tree-container { width: 100%; border-right: none; }
      #detail-container {
        position: absolute;
        inset: 0;
        width: 100%;
        background: var(--bg);
        z-index: 20;
        display: none;
        padding: 14px;
      }
      #detail-container.mobile-open { display: block; }
      .mobile-back-btn { display: block; }
      .grid-specs { grid-template-columns: 1fr; }
      select.ut-select { max-width: 100%; width: 100%; }
      .station-select { max-width: 100%; flex: 1; }

      .toggle-filters-btn { display: inline-flex; align-items: center; gap: 4px; }
      .controls-bar { display: none; }
      .controls-bar.mobile-filters-open { display: flex; }
    }
  </style>
</head>
<body>

  <header>
    <div class="header-top">
      <div class="title-group">
        <h1>⚙️ Levantamiento SAP</h1>
        <select id="filterEstacion" class="station-select" title="Selecciona la Estación de trabajo">
          <option value="">📍 Seleccionar Estación...</option>
        </select>
        <span id="netStatus" class="status-pill">En línea</span>
      </div>
      <div style="display:flex; gap:5px; align-items:center; flex-wrap:wrap;">
        <input type="text" id="inspectorName" class="inspector-input" value="Rodrigo" placeholder="Inspector" />
        <button class="create-btn" onclick="abrirPanelCreaciones()" id="btnCreaciones">➕ Creaciones (0)</button>
        <button class="primary" onclick="cargarDatos(true)" title="Descargar datos nuevos de Sheets">↻ Sync</button>
        <button class="export-btn" onclick="exportarJornadaZIP()">📦 Exportar ZIP</button>
      </div>
    </div>

    <div class="progress-wrapper">
      <span id="progressText">Selecciona una estación para ver el avance</span>
      <div class="progress-bar"><div id="progressFill" class="progress-fill"></div></div>
    </div>

    <div class="search-row">
      <input type="text" id="searchInput" class="search-box" placeholder="Buscar TAG, Equipo SAP, UT o palabra clave..." />
      <button type="button" class="toggle-filters-btn" onclick="toggleFiltrosMovil()" id="btnToggleFilters">🎛️ Filtros</button>
    </div>

    <div class="controls-bar" id="controlsBar">
      <select id="filterUT" class="ut-select"><option value="">Todas las UTs</option></select>
      <select id="filterEstado">
        <option value="">Todos los estados</option>
        <option value="PENDIENTE">⏳ Pendientes</option>
        <option value="LEVANTADO">✅ Levantados</option>
        <option value="NO_ENCONTRADO">❌ No encontrados</option>
      </select>
      <select id="filterEvidencia">
        <option value="">Toda evidencia</option>
        <option value="CON_FOTOS">📷 Con fotos</option>
        <option value="SIN_FOTOS_LEV">⚠️ Levantado sin fotos</option>
        <option value="CON_OBS">📝 Con observaciones</option>
      </select>
      <select id="filterTroncal"><option value="">Todas las Troncales</option></select>
      <select id="filterCriticidad"><option value="">Toda Criticidad</option></select>
      <button onclick="expandirTodo(true)">+ Expandir</button>
      <button onclick="expandirTodo(false)">- Contraer</button>
    </div>
  </header>

  <main>
    <div id="tree-container">
      <div class="loader">Iniciando base de datos local...</div>
    </div>
    <div id="detail-container">
      <button class="mobile-back-btn" onclick="cerrarDetalleMovil()">← Volver al árbol de equipos</button>
      <div id="detail-content">
        <div class="empty-state">Selecciona una Estación arriba y navega por el árbol para tocar el equipo que vas a levantar.</div>
      </div>
    </div>
  </main>

  <script>
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("./sw.js").catch(err => console.warn("SW no registrado:", err));
    }

    const API_URL = "https://script.google.com/macros/s/AKfycbx_V7vCNrVFpOGeD3waVKZ7RIJkAer2Z-KLj2bxbmv5g8AgjxZeDqqqihu5NT4F_0th/exec";
    const DB_NAME = "SAPLevantamientoDB_v2";
    const DB_VERSION = 1;
    const MAX_FOTOS = 10;

    let db;
    let rawUT = [];
    let rawEQ = [];
    let treeData = [];
    let registrosCampo = {};
    let creacionesNuevas = {};
    let nodoSeleccionado = null;
    let fotosTemporalesCreacion = [];
    let obsTimer = null;

    function toggleFiltrosMovil() {
      const bar = document.getElementById("controlsBar");
      const btn = document.getElementById("btnToggleFilters");
      const abierta = bar.classList.toggle("mobile-filters-open");
      btn.textContent = abierta ? "✕ Filtros" : "🎛️ Filtros";
    }

    function actualizarEstadoRed() {
      const pill = document.getElementById("netStatus");
      if (navigator.onLine) {
        pill.textContent = "En línea";
        pill.classList.remove("offline");
      } else {
        pill.textContent = "Modo Offline";
        pill.classList.add("offline");
      }
    }
    window.addEventListener("online", actualizarEstadoRed);
    window.addEventListener("offline", actualizarEstadoRed);
    actualizarEstadoRed();

    const inspectorInput = document.getElementById("inspectorName");
    if (localStorage.getItem("sap_inspector")) inspectorInput.value = localStorage.getItem("sap_inspector");
    inspectorInput.addEventListener("change", () => localStorage.setItem("sap_inspector", inspectorInput.value.trim() || "Rodrigo"));

    // ==========================================
    // 1. INDEXEDDB
    // ==========================================
    function initDB() {
      return new Promise((resolve, reject) => {
        const request = indexedDB.open(DB_NAME, DB_VERSION);
        request.onupgradeneeded = (e) => {
          const database = e.target.result;
          if (!database.objectStoreNames.contains("catalogo")) database.createObjectStore("catalogo");
          if (!database.objectStoreNames.contains("levantamiento")) database.createObjectStore("levantamiento", { keyPath: "id" });
          if (!database.objectStoreNames.contains("creaciones")) database.createObjectStore("creaciones", { keyPath: "id" });
        };
        request.onsuccess = (e) => { db = e.target.result; resolve(db); };
        request.onerror = (e) => reject(e.target.error);
      });
    }

    function guardarEnStore(storeName, data, key = null) {
      return new Promise((resolve, reject) => {
        const tx = db.transaction(storeName, "readwrite");
        const store = tx.objectStore(storeName);
        const req = key ? store.put(data, key) : store.put(data);
        req.onsuccess = () => resolve();
        req.onerror = (e) => reject(e.target.error);
      });
    }

    function eliminarDeStore(storeName, key) {
      return new Promise((resolve, reject) => {
        const tx = db.transaction(storeName, "readwrite");
        const store = tx.objectStore(storeName);
        const req = store.delete(key);
        req.onsuccess = () => resolve();
        req.onerror = (e) => reject(e.target.error);
      });
    }

    function leerDeStore(storeName, key = null) {
      return new Promise((resolve, reject) => {
        const tx = db.transaction(storeName, "readonly");
        const store = tx.objectStore(storeName);
        const req = key ? store.get(key) : store.getAll();
        req.onsuccess = () => resolve(req.result);
        req.onerror = (e) => reject(e.target.error);
      });
    }

    // ==========================================
    // 2. EXTRACCIÓN DE ESTACIÓN Y CARGA DE DATOS
    // ==========================================
    const NOMBRES_EMPLAZAMIENTO = {
      "P0090": "Estación Chimitá",
      "P0230": "Estación Galán",
      "P0310": "Estación Lizama",
      "P0520": "Estación Santa Rosa",
      "P0540": "Estación Sebastopol",
      "P0630": "Estación Vasconia"
    };

    function obtenerNombreEstacion(codigo, item = null) {
      const codLimpio = String(codigo || "").trim();
      if (!codLimpio) return "General / Sin Estación";

      if (NOMBRES_EMPLAZAMIENTO[codLimpio]) {
        return `${codLimpio} - ${NOMBRES_EMPLAZAMIENTO[codLimpio]}`;
      }

      const textoRef = `${item?.["Ubicación técnica"] || ""} ${item?.["Denominación de la ubicación técnica"] || ""} ${item?.["Denominación de objeto técnico"] || ""}`.toUpperCase();
      const prefijos = [
        { key: "PVAS", label: "Estación Vasconia" },
        { key: "PBUC", label: "Estación Chimitá" },
        { key: "PGAL", label: "Estación Galán" },
        { key: "PSEB", label: "Estación Sebastopol" },
        { key: "PSRO", label: "Estación Santa Rosa" },
        { key: "PCHI", label: "Estación Chimita" },
        { key: "PLIZ", label: "Estación Lizama" }
      ];

      for (const p of prefijos) {
        if (textoRef.includes(p.key)) {
          return `${codLimpio} - ${p.label}`;
        }
      }

      return codLimpio;
    }

    function detectarEstacion(item) {
      let codigo = "";
      if (item["Emplazamiento"] && String(item["Emplazamiento"]).trim() !== "") {
        codigo = String(item["Emplazamiento"]).trim();
      } else if (item["Estación"] && String(item["Estación"]).trim() !== "") {
        codigo = String(item["Estación"]).trim();
      } else if (item["Estacion"] && String(item["Estacion"]).trim() !== "") {
        codigo = String(item["Estacion"]).trim();
      } else {
        const ut = String(item["Ubicación técnica"] || "").toUpperCase();
        const partes = ut.split("-");
        if (partes.length >= 2 && partes[1].length >= 3) codigo = partes[1];
        else codigo = "SIN_EMPLAZAMIENTO";
      }

      return obtenerNombreEstacion(codigo, item);
    }

    async function cargarDatos(forzarRed = false) {
      const container = document.getElementById("tree-container");
      if (!db) await initDB();

      const listaAvances = await leerDeStore("levantamiento");
      registrosCampo = {};
      (listaAvances || []).forEach(reg => { registrosCampo[reg.id] = reg; });

      const listaCreaciones = await leerDeStore("creaciones");
      creacionesNuevas = {};
      (listaCreaciones || []).forEach(cr => { creacionesNuevas[cr.id] = cr; });
      actualizarBotonCreaciones();

      if (!forzarRed) {
        const cachedCatalog = await leerDeStore("catalogo", "sap_data");
        if (cachedCatalog && (cachedCatalog.ubicaciones?.length || cachedCatalog.equipos?.length)) {
          rawUT = cachedCatalog.ubicaciones || [];
          rawEQ = cachedCatalog.equipos || [];
          inicializarVista();
          return;
        }
      }

      if (!navigator.onLine) {
        container.innerHTML = `<div class="loader" style="color:#fbbf24;">Estás sin internet y aún no has descargado el catálogo. Conéctate una vez y pulsa "↻ Sync".</div>`;
        return;
      }

      container.innerHTML = '<div class="loader">Descargando estructura SAP desde Google Sheets...</div>';

      try {
        const url = forzarRed ? `${API_URL}?refresh=1` : API_URL;
        const res = await fetch(url);
        const json = await res.json();
        rawUT = json.ubicaciones || [];
        rawEQ = json.equipos || [];

        await guardarEnStore("catalogo", json, "sap_data");
        inicializarVista();
      } catch (err) {
        container.innerHTML = `<div class="loader" style="color:#f87171;">Error al conectar con Google Sheets.<br><small>${err}</small></div>`;
      }
    }

    function inicializarVista() {
      rawUT.forEach(u => u._estacionNorm = detectarEstacion(u));
      rawEQ.forEach(e => e._estacionNorm = detectarEstacion(e));

      poblarEstaciones();
      aplicarCambioEstacion();
    }

    function poblarEstaciones() {
      const estaciones = new Set();
      [...rawUT, ...rawEQ].forEach(item => {
        if (item._estacionNorm) estaciones.add(item._estacionNorm);
      });

      const selEstacion = document.getElementById("filterEstacion");
      const guardada = localStorage.getItem("sap_estacion_activa") || "";
      const lista = [...estaciones].sort();

      selEstacion.innerHTML = '<option value="TODAS">🌐 Todas las Estaciones</option>';
      lista.forEach(est => {
        selEstacion.innerHTML += `<option value="${est}">📍 ${est}</option>`;
      });

      if (guardada && (guardada === "TODAS" || lista.includes(guardada))) {
        selEstacion.value = guardada;
      } else if (lista.length > 0) {
        selEstacion.value = lista[0];
      }
    }

    function aplicarCambioEstacion() {
      const estSeleccionada = document.getElementById("filterEstacion").value;
      localStorage.setItem("sap_estacion_activa", estSeleccionada);

      const utFiltradas = estSeleccionada === "TODAS" ? rawUT : rawUT.filter(u => u._estacionNorm === estSeleccionada);
      const eqFiltrados = estSeleccionada === "TODAS" ? rawEQ : rawEQ.filter(e => e._estacionNorm === estSeleccionada);

      poblarFiltroUT(utFiltradas, eqFiltrados);
      poblarFiltrosSecundarios(utFiltradas, eqFiltrados);
      treeData = construirArbol(utFiltradas, eqFiltrados);
      actualizarProgreso(eqFiltrados);
      actualizarBotonCreaciones();
      renderizarArbol();
    }

    function poblarFiltroUT(utList, eqList) {
      const selUT = document.getElementById("filterUT");
      const opcionesMap = new Map();

      utList.forEach(u => {
        const id = String(u["Ubicación técnica"] || "").trim();
        if (id) {
          const nom = u["Denominación de la ubicación técnica"] || "";
          opcionesMap.set(id, nom ? `${id} - ${nom}` : id);
        }
      });

      eqList.forEach(e => {
        const id = String(e["Ubicación técnica"] || "").trim();
        if (id && !opcionesMap.has(id)) {
          opcionesMap.set(id, id);
        }
      });

      selUT.innerHTML = '<option value="">Todas las UTs</option>';
      [...opcionesMap.entries()]
        .sort((a, b) => a[0].localeCompare(b[0]))
        .forEach(([id, label]) => {
          selUT.innerHTML += `<option value="${id}">${label}</option>`;
        });
    }

    function actualizarProgreso(eqList = null) {
      const estSeleccionada = document.getElementById("filterEstacion").value;
      const equiposActivos = eqList || (estSeleccionada === "TODAS" ? rawEQ : rawEQ.filter(e => e._estacionNorm === estSeleccionada));

      const totalEquipos = equiposActivos.length;
      let levantados = 0;
      let noEncontrados = 0;

      equiposActivos.forEach(eq => {
        const reg = registrosCampo[eq["Equipo"]];
        if (reg?.estado === "LEVANTADO") levantados++;
        if (reg?.estado === "NO_ENCONTRADO") noEncontrados++;
      });

      const pct = totalEquipos > 0 ? Math.round(((levantados + noEncontrados) / totalEquipos) * 100) : 0;
      document.getElementById("progressText").textContent = `${estSeleccionada === "TODAS" ? "Total" : estSeleccionada}: ${levantados} / ${totalEquipos} levantados (${noEncontrados} no enc.) · ${pct}%`;
      document.getElementById("progressFill").style.width = `${pct}%`;
    }

    function poblarFiltrosSecundarios(utList, eqList) {
      const troncales = new Set();
      const criticidades = new Set();

      [...utList, ...eqList].forEach(item => {
        if (item["Troncal"]) troncales.add(item["Troncal"]);
        if (item["Criticidad"]) criticidades.add(item["Criticidad"]);
      });

      const selTroncal = document.getElementById("filterTroncal");
      selTroncal.innerHTML = '<option value="">Todas las Troncales</option>';
      [...troncales].sort().forEach(t => selTroncal.innerHTML += `<option value="${t}">${t}</option>`);

      const selCrit = document.getElementById("filterCriticidad");
      selCrit.innerHTML = '<option value="">Toda Criticidad</option>';
      [...criticidades].sort().forEach(c => selCrit.innerHTML += `<option value="${c}">Criticidad: ${c}</option>`);
    }

    function construirArbol(ubicaciones, equipos) {
      const mapUT = {};
      const mapEQ = {};
      const roots = [];

      ubicaciones.forEach(u => {
        const id = u["Ubicación técnica"];
        if (!id) return;
        const textoBusqueda = `${id} ${u["Denominación de la ubicación técnica"] || ""} ${Object.values(u).join(" ")}`.toLowerCase();
        mapUT[id] = {
          tipo: "UT",
          id: id,
          nombre: u["Denominación de la ubicación técnica"] || "Sin denominación",
          padreUT: u["Ubicación técnica superior"] || "",
          raw: u,
          _searchText: textoBusqueda,
          children: []
        };
      });

      equipos.forEach(e => {
        const id = e["Equipo"];
        if (!id) return;
        const textoBusqueda = `${id} ${e["Denominación de objeto técnico"] || ""} ${Object.values(e).join(" ")}`.toLowerCase();
        mapEQ[id] = {
          tipo: e["Equipo superior"] ? "SUBEQ" : "EQ",
          id: id,
          nombre: e["Denominación de objeto técnico"] || "Sin denominación",
          padreUT: e["Ubicación técnica"] || "",
          padreEQ: e["Equipo superior"] || "",
          raw: e,
          _searchText: textoBusqueda,
          children: []
        };
      });

      Object.values(mapUT).forEach(ut => {
        if (ut.padreUT && mapUT[ut.padreUT]) mapUT[ut.padreUT].children.push(ut);
        else roots.push(ut);
      });

      Object.values(mapEQ).forEach(eq => {
        if (eq.padreEQ && mapEQ[eq.padreEQ]) mapEQ[eq.padreEQ].children.push(eq);
        else if (eq.padreUT && mapUT[eq.padreUT]) mapUT[eq.padreUT].children.push(eq);
        else roots.push(eq);
      });

      return roots;
    }

    // ==========================================
    // 3. RENDERIZADO Y NAVEGACIÓN FLUIDA DEL ÁRBOL
    // ==========================================
    function renderizarArbol() {
      const query = document.getElementById("searchInput").value.toLowerCase().trim();
      const troncal = document.getElementById("filterTroncal").value;
      const crit = document.getElementById("filterCriticidad").value;
      const estadoFiltro = document.getElementById("filterEstado").value;
      const utFiltro = document.getElementById("filterUT").value;
      const evFiltro = document.getElementById("filterEvidencia").value;

      const hayFiltro =
        query.length > 0 ||
        troncal !== "" ||
        crit !== "" ||
        estadoFiltro !== "" ||
        utFiltro !== "" ||
        evFiltro !== "";

      const arbolFiltrado = hayFiltro
        ? filtrarNodos(treeData, query, troncal, crit, estadoFiltro, utFiltro, evFiltro)
        : treeData;

      const container = document.getElementById("tree-container");
      container.innerHTML = "";

      if (arbolFiltrado.length === 0) {
        container.innerHTML = '<div class="empty-state">No se encontraron activos en esta estación con esos filtros.</div>';
        return;
      }

      const fragment = document.createDocumentFragment();
      arbolFiltrado.forEach(root => fragment.appendChild(crearElementoNodo(root, true, hayFiltro)));
      container.appendChild(fragment);
    }

    function filtrarNodos(nodos, query, troncal, crit, estadoFiltro, utFiltro, evFiltro, ancestroCoincidio = false) {
      return nodos.map(nodo => {
        const reg = registrosCampo[nodo.id];
        const estadoActual = reg?.estado || "PENDIENTE";
        const numFotos = (reg?.fotos || []).length;
        const tieneObs = Boolean(reg?.observaciones && reg.observaciones.trim() !== "");

        const matchQuery = !query || nodo._searchText.includes(query);
        const matchTroncal = !troncal || nodo.raw["Troncal"] === troncal;
        const matchCrit = !crit || nodo.raw["Criticidad"] === crit;
        const matchEstado = !estadoFiltro || (nodo.tipo !== "UT" && estadoActual === estadoFiltro);

        const utNodo = String(nodo.raw?.["Ubicación técnica"] || nodo.id || "");
        const utSupNodo = String(nodo.raw?.["Ubicación técnica superior"] || "");
        const matchUT =
          !utFiltro ||
          nodo.id === utFiltro ||
          utNodo === utFiltro ||
          utNodo.startsWith(utFiltro) ||
          utSupNodo === utFiltro ||
          utSupNodo.startsWith(utFiltro);

        let matchEvidencia = true;
        if (evFiltro === "CON_FOTOS") matchEvidencia = numFotos > 0;
        else if (evFiltro === "SIN_FOTOS_LEV") matchEvidencia = nodo.tipo !== "UT" && estadoActual === "LEVANTADO" && numFotos === 0;
        else if (evFiltro === "CON_OBS") matchEvidencia = tieneObs;

        const esteNodoCoincide = matchQuery && matchTroncal && matchCrit && matchEstado && matchUT && matchEvidencia;
        const mostrarHijosCompletos = ancestroCoincidio || ((Boolean(query) || Boolean(utFiltro)) && !estadoFiltro && !evFiltro && esteNodoCoincide);

        const hijosFiltrados = mostrarHijosCompletos
          ? filtrarNodos(nodo.children, "", troncal, crit, estadoFiltro, "", evFiltro, true)
          : filtrarNodos(nodo.children, query, troncal, crit, estadoFiltro, utFiltro, evFiltro, false);

        if (esteNodoCoincide || hijosFiltrados.length > 0) {
          return {
            ...nodo,
            children: hijosFiltrados,
            _expandirPorFiltro: !ancestroCoincidio && hijosFiltrados.length > 0
          };
        }
        return null;
      }).filter(Boolean);
    }

    function crearElementoNodo(nodo, isRoot, hayFiltro) {
      const div = document.createElement("div");
      div.className = isRoot ? "node node-root" : "node";

      const tieneHijos = nodo.children && nodo.children.length > 0;
      const abrirHijos = hayFiltro && (nodo._expandirPorFiltro !== false);

      const badgeClass = nodo.tipo === "UT" ? "badge-ut" : (nodo.tipo === "EQ" ? "badge-eq" : "badge-sub");
      const badgeText = nodo.tipo === "UT" ? "UT" : (nodo.tipo === "EQ" ? "EQ" : "SUB");

      const reg = registrosCampo[nodo.id];
      let rowStatusClass = "";
      let statusIcon = "";
      if (reg?.estado === "LEVANTADO") {
        rowStatusClass = "status-levantado";
        statusIcon = "✅";
      } else if (reg?.estado === "NO_ENCONTRADO") {
        rowStatusClass = "status-no-encontrado";
        statusIcon = "❌";
      }

      const row = document.createElement("div");
      row.className = `node-row ${rowStatusClass} ${nodoSeleccionado?.id === nodo.id ? "selected" : ""}`;
      row.dataset.id = nodo.id;
      row.innerHTML = `
        <span class="toggle" title="Expandir/Contraer">${tieneHijos ? (abrirHijos ? "▼" : "▶") : "•"}</span>
        ${statusIcon ? `<span class="status-dot">${statusIcon}</span>` : ""}
        <span class="badge ${badgeClass}">${badgeText}</span>
        <span class="code">${nodo.id}</span>
        <span class="desc" title="${nodo.nombre}">${nodo.nombre}</span>
        ${nodo.tipo === "UT" ? `<button class="ut-info-btn" title="Ver ficha de Ubicación Técnica">Ficha</button>` : ""}
      `;

      const toggleSpan = row.querySelector(".toggle");
      toggleSpan.onclick = (e) => {
        e.stopPropagation();
        if (tieneHijos) {
          const childrenDiv = div.querySelector(".children");
          const isOpen = childrenDiv.classList.toggle("open");
          toggleSpan.textContent = isOpen ? "▼" : "▶";
        }
      };

      if (nodo.tipo === "UT") {
        const infoBtn = row.querySelector(".ut-info-btn");
        infoBtn.onclick = (e) => {
          e.stopPropagation();
          seleccionarYAbrirNodo(row, nodo);
        };
      }

      row.onclick = (e) => {
        e.stopPropagation();
        if (nodo.tipo === "UT") {
          if (tieneHijos) {
            const childrenDiv = div.querySelector(".children");
            const isOpen = childrenDiv.classList.toggle("open");
            toggleSpan.textContent = isOpen ? "▼" : "▶";
          } else {
            seleccionarYAbrirNodo(row, nodo);
          }
        } else {
          seleccionarYAbrirNodo(row, nodo);
        }
      };

      div.appendChild(row);

      if (tieneHijos) {
        const childrenContainer = document.createElement("div");
        childrenContainer.className = abrirHijos ? "children open" : "children";
        nodo.children.forEach(hijo => childrenContainer.appendChild(crearElementoNodo(hijo, false, hayFiltro)));
        div.appendChild(childrenContainer);
      }

      return div;
    }

    function seleccionarYAbrirNodo(row, nodo) {
      document.querySelectorAll(".node-row.selected").forEach(el => el.classList.remove("selected"));
      row.classList.add("selected");
      mostrarDetalle(nodo);
    }

    // ==========================================
    // 4. FICHA DE LEVANTAMIENTO (HASTA 10 FOTOS)
    // ==========================================
    function mostrarDetalle(nodo) {
      nodoSeleccionado = nodo;
      const detailContainer = document.getElementById("detail-container");
      const content = document.getElementById("detail-content");
      detailContainer.classList.add("mobile-open");
      document.body.classList.add("mobile-detail-active");
      detailContainer.scrollTop = 0;

      const r = nodo.raw;
      const badgeClass = nodo.tipo === "UT" ? "badge-ut" : (nodo.tipo === "EQ" ? "badge-eq" : "badge-sub");
      const tipoLabel = nodo.tipo === "UT" ? "Ubicación Técnica (IH06)" : (nodo.tipo === "EQ" ? "Equipo Principal (IH08)" : "Sub-equipo (IH08)");

      const reg = registrosCampo[nodo.id] || { id: nodo.id, estado: "PENDIENTE", observaciones: "", fotos: [] };
      const esLevantado = reg.estado === "LEVANTADO";
      const esNoEncontrado = reg.estado === "NO_ENCONTRADO";

      let metaHTML = "";
      if (reg.fecha) {
        metaHTML = `<div class="meta-stamp ${esNoEncontrado ? "err" : ""}">
          ${esLevantado ? "✓ Levantado" : "✕ No encontrado"} el ${reg.fecha} por <strong>${reg.inspector || "Rodrigo"}</strong>
        </div>`;
      }

      let fotosHTML = (reg.fotos || []).map((src, idx) => `
        <div class="photo-thumb">
          <img src="${src}" onclick="verFotoGrande('${src}')" />
          <button class="photo-del" onclick="eliminarFoto(${idx})" title="Borrar foto">✕</button>
        </div>
      `).join("");

      let specsHTML = "";
      Object.entries(r).forEach(([clave, valor]) => {
        if (!clave.startsWith("_") && valor && String(valor).trim() !== "") {
          specsHTML += `
            <div class="spec-card">
              <div class="spec-label">${clave}</div>
              <div class="spec-value">${valor}</div>
            </div>
          `;
        }
      });

      content.innerHTML = `
        <div class="detail-header">
          <span class="badge ${badgeClass}">${tipoLabel}</span>
          <h2 class="detail-title">${nodo.nombre}</h2>
          <div class="detail-code">
            <span>${nodo.id}</span>
            <button onclick="navigator.clipboard.writeText('${nodo.id}')" style="padding:3px 8px; font-size:0.75rem;">📋 Copiar</button>
          </div>
        </div>

        <div class="field-capture-box">
          <h3><span>Registro en Campo</span> <span>Fotos: ${(reg.fotos || []).length} / ${MAX_FOTOS}</span></h3>
          
          <div class="action-buttons">
            <button class="btn-check ${esLevantado ? "active-ok" : ""}" onclick="cambiarEstado('LEVANTADO')">✅ Levantado</button>
            <button class="btn-check ${esNoEncontrado ? "active-err" : ""}" onclick="cambiarEstado('NO_ENCONTRADO')">❌ No encontrado</button>
          </div>

          ${metaHTML}

          <div class="photo-controls">
            <label class="photo-btn">
              📷 Tomar Foto
              <input type="file" accept="image/*" capture="environment" style="display:none" onchange="procesarFotos(event)" ${(reg.fotos || []).length >= MAX_FOTOS ? "disabled" : ""} />
            </label>
            <label class="photo-btn">
              🖼️ Galería
              <input type="file" accept="image/*" multiple style="display:none" onchange="procesarFotos(event)" ${(reg.fotos || []).length >= MAX_FOTOS ? "disabled" : ""} />
            </label>
          </div>

          <div class="photo-grid">${fotosHTML}</div>

          <label class="form-label">Observaciones / Datos de placa (se exporta directo en el Excel):</label>
          <textarea class="obs-input" placeholder="Escribe aquí observaciones técnicas, serie, marca, modelo o novedades..." oninput="guardarObservacionDebounced(this.value)" onblur="guardarObservacion(this.value)">${reg.observaciones || ""}</textarea>
        </div>

        <div class="grid-specs">${specsHTML}</div>
      `;
    }

    function cerrarDetalleMovil() {
      document.getElementById("detail-container").classList.remove("mobile-open");
      document.body.classList.remove("mobile-detail-active");
    }

    async function cambiarEstado(nuevoEstado) {
      if (!nodoSeleccionado) return;
      const id = nodoSeleccionado.id;
      const actual = registrosCampo[id] || { id, observaciones: "", fotos: [] };

      if (actual.estado === nuevoEstado) {
        actual.estado = "PENDIENTE";
        actual.fecha = null;
      } else {
        actual.estado = nuevoEstado;
        const ahora = new Date();
        actual.fecha = ahora.toLocaleDateString("es-CO") + " " + ahora.toLocaleTimeString("es-CO", { hour: "2-digit", minute: "2-digit" });
        actual.inspector = document.getElementById("inspectorName").value.trim() || "Rodrigo";
      }

      registrosCampo[id] = actual;
      await guardarEnStore("levantamiento", actual);
      actualizarProgreso();
      renderizarArbol();
      mostrarDetalle(nodoSeleccionado);
    }

    function guardarObservacionDebounced(texto) {
      clearTimeout(obsTimer);
      obsTimer = setTimeout(() => guardarObservacion(texto), 300);
    }

    async function guardarObservacion(texto) {
      if (!nodoSeleccionado) return;
      const id = nodoSeleccionado.id;
      const actual = registrosCampo[id] || { id, estado: "PENDIENTE", fotos: [] };
      if (actual.observaciones === texto) return;
      actual.observaciones = texto;
      registrosCampo[id] = actual;
      await guardarEnStore("levantamiento", actual);
    }

    async function procesarFotos(event) {
      if (!nodoSeleccionado) return;
      const files = Array.from(event.target.files);
      if (!files.length) return;

      const id = nodoSeleccionado.id;
      const actual = registrosCampo[id] || { id, estado: "PENDIENTE", observaciones: "", fotos: [] };
      if (!actual.fotos) actual.fotos = [];

      for (const file of files) {
        if (actual.fotos.length >= MAX_FOTOS) break;
        const dataUrl = await comprimirYEstamparImagen(file, id);
        actual.fotos.push(dataUrl);
      }

      if (actual.estado === "PENDIENTE") {
        actual.estado = "LEVANTADO";
        const ahora = new Date();
        actual.fecha = ahora.toLocaleDateString("es-CO") + " " + ahora.toLocaleTimeString("es-CO", { hour: "2-digit", minute: "2-digit" });
        actual.inspector = document.getElementById("inspectorName").value.trim() || "Rodrigo";
      }

      registrosCampo[id] = actual;
      await guardarEnStore("levantamiento", actual);
      actualizarProgreso();
      renderizarArbol();
      mostrarDetalle(nodoSeleccionado);
    }

    function comprimirYEstamparImagen(file, etiqueta) {
      return new Promise((resolve) => {
        const reader = new FileReader();
        reader.onload = (e) => {
          const img = new Image();
          img.onload = () => {
            const canvas = document.createElement("canvas");
            const MAX_WIDTH = 1280;
            let width = img.width;
            let height = img.height;

            if (width > MAX_WIDTH) {
              height = Math.round((height * MAX_WIDTH) / width);
              width = MAX_WIDTH;
            }

            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext("2d");
            ctx.drawImage(img, 0, 0, width, height);

            const ahora = new Date();
            const sello = `${etiqueta} | ${ahora.toLocaleDateString("es-CO")} ${ahora.toLocaleTimeString("es-CO", { hour: "2-digit", minute: "2-digit" })}`;
            ctx.fillStyle = "rgba(0, 0, 0, 0.65)";
            ctx.fillRect(0, height - 32, width, 32);
            ctx.fillStyle = "#38bdf8";
            ctx.font = "bold 15px monospace";
            ctx.fillText(sello, 12, height - 11);

            resolve(canvas.toDataURL("image/jpeg", 0.78));
          };
          img.src = e.target.result;
        };
        reader.readAsDataURL(file);
      });
    }

    async function eliminarFoto(index) {
      if (!nodoSeleccionado || !confirm("¿Eliminar esta foto?")) return;
      const id = nodoSeleccionado.id;
      const actual = registrosCampo[id];
      if (!actual || !actual.fotos) return;
      actual.fotos.splice(index, 1);
      await guardarEnStore("levantamiento", actual);
      mostrarDetalle(nodoSeleccionado);
    }

    function verFotoGrande(src) {
      const w = window.open("");
      w.document.write(`<img src="${src}" style="max-width:100%; background:#000;" />`);
    }

    // ==========================================
    // 5. MÓDULO DE CREACIONES (EQUIPOS NUEVOS NO EN SAP)
    // ==========================================
    function actualizarBotonCreaciones() {
      const total = Object.keys(creacionesNuevas).length;
      document.getElementById("btnCreaciones").textContent = `➕ Creaciones (${total})`;
    }

    function abrirPanelCreaciones(idEditar = null) {
      nodoSeleccionado = null;
      if (!idEditar) fotosTemporalesCreacion = [];

      const detailContainer = document.getElementById("detail-container");
      const content = document.getElementById("detail-content");
      detailContainer.classList.add("mobile-open");
      document.body.classList.add("mobile-detail-active");
      detailContainer.scrollTop = 0;

      const estActual = document.getElementById("filterEstacion").value;
      const utEstacion = rawUT.filter(u => estActual === "TODAS" || u._estacionNorm === estActual);

      const opcionesUT = utEstacion.map(u => 
        `<option value="${u["Ubicación técnica"]}">${u["Ubicación técnica"]} - ${u["Denominación de la ubicación técnica"] || ""}</option>`
      ).join("");

      const item = idEditar ? creacionesNuevas[idEditar] : null;
      const fotos = item ? (item.fotos || []) : fotosTemporalesCreacion;

      const fotosHTML = fotos.map((src, idx) => `
        <div class="photo-thumb">
          <img src="${src}" onclick="verFotoGrande('${src}')" />
          <button class="photo-del" onclick="${idEditar ? `eliminarFotoCreacion('${idEditar}', ${idx})` : `eliminarFotoTempCreacion(${idx})`}" title="Borrar foto">✕</button>
        </div>
      `).join("");

      const listaExistentesHTML = Object.values(creacionesNuevas).map(cr => `
        <div class="creation-card" onclick="abrirPanelCreaciones('${cr.id}')">
          <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:4px;">
            <span class="badge badge-new">CREACIÓN NUEVA</span>
            <span style="font-size:0.75rem; color:var(--muted);">${cr.estacion} · 📷 ${(cr.fotos || []).length}</span>
          </div>
          <div style="font-weight:700; font-size:0.95rem;">${cr.tag ? `[${cr.tag}] ` : ""}${cr.denominacion}</div>
          <div style="font-size:0.78rem; color:var(--accent); font-family:monospace; margin-top:2px;">UT: ${cr.ut || "Sin UT"}</div>
        </div>
      `).join("");

      content.innerHTML = `
        <div class="detail-header">
          <span class="badge badge-new">Alta de Equipo Físico (No existe en SAP)</span>
          <h2 class="detail-title">${item ? "Editar Creación" : "Nueva Creación en Campo"}</h2>
          <p style="font-size:0.8rem; color:var(--muted);">Registra equipos encontrados en planta que deben crearse en SAP.</p>
        </div>

        <div class="field-capture-box">
          <label class="form-label">Ubicación Técnica Padre (Donde está instalado):</label>
          <input list="listaUTCreacion" id="cr_ut" class="form-input" value="${item?.ut || ""}" placeholder="Escribe o selecciona la UT..." />
          <datalist id="listaUTCreacion">${opcionesUT}</datalist>

          <label class="form-label">TAG Físico / Placa (Opcional):</label>
          <input type="text" id="cr_tag" class="form-input" value="${item?.tag || ""}" placeholder="Ej: PIT-104B, BOM-02..." />

          <label class="form-label">Denominación / Nombre del Equipo *:</label>
          <input type="text" id="cr_denom" class="form-input" value="${item?.denominacion || ""}" placeholder="Ej: Transmisor de presión salida bomba..." />

          <label class="form-label">Observaciones / Datos de Placa (Marca, Modelo, Serie, Capacidad):</label>
          <textarea id="cr_obs" class="obs-input" placeholder="Detalla fabricante, modelo, número de serie y características técnicas para su creación en SAP...">${item?.observaciones || ""}</textarea>

          <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;">
            <span class="form-label" style="margin:0;">Evidencia Fotográfica (${fotos.length} / ${MAX_FOTOS}):</span>
          </div>

          <div class="photo-controls">
            <label class="photo-btn">
              📷 Tomar Foto
              <input type="file" accept="image/*" capture="environment" style="display:none" onchange="procesarFotoCreacion(event, '${idEditar || ""}')" ${fotos.length >= MAX_FOTOS ? "disabled" : ""} />
            </label>
            <label class="photo-btn">
              🖼️ Galería
              <input type="file" accept="image/*" multiple style="display:none" onchange="procesarFotoCreacion(event, '${idEditar || ""}')" ${fotos.length >= MAX_FOTOS ? "disabled" : ""} />
            </label>
          </div>

          <div class="photo-grid" id="cr_photo_grid">${fotosHTML}</div>

          <div style="display:flex; gap:8px; margin-top:10px;">
            <button class="export-btn" style="flex:1; padding:11px;" onclick="guardarCreacion('${idEditar || ""}')">💾 Guardar Equipo Nuevo</button>
            ${idEditar ? `<button style="background:#ef4444; color:white; border:none; padding:11px;" onclick="borrarCreacion('${idEditar}')">🗑️ Eliminar</button>` : ""}
          </div>
        </div>

        <h3 style="font-size:0.9rem; color:var(--muted); margin:18px 0 10px;">Equipos registrados para creación (${Object.keys(creacionesNuevas).length})</h3>
        ${listaExistentesHTML || '<div style="font-size:0.82rem; color:var(--muted);">Aún no has registrado equipos nuevos.</div>'}
      `;
    }

    function eliminarFotoTempCreacion(index) {
      fotosTemporalesCreacion.splice(index, 1);
      abrirPanelCreaciones(null);
    }

    async function procesarFotoCreacion(event, idEditar) {
      const files = Array.from(event.target.files);
      if (!files.length) return;

      const tag = document.getElementById("cr_tag").value.trim() || "CREACION_SAP";
      let listaFotos = idEditar && creacionesNuevas[idEditar] ? [...creacionesNuevas[idEditar].fotos] : [...fotosTemporalesCreacion];

      for (const file of files) {
        if (listaFotos.length >= MAX_FOTOS) break;
        const dataUrl = await comprimirYEstamparImagen(file, tag);
        listaFotos.push(dataUrl);
      }

      if (idEditar && creacionesNuevas[idEditar]) {
        creacionesNuevas[idEditar].fotos = listaFotos;
        await guardarEnStore("creaciones", creacionesNuevas[idEditar]);
        abrirPanelCreaciones(idEditar);
      } else {
        fotosTemporalesCreacion = listaFotos;
        const grid = document.getElementById("cr_photo_grid");
        grid.innerHTML = listaFotos.map((src, idx) => `
          <div class="photo-thumb">
            <img src="${src}" onclick="verFotoGrande('${src}')" />
            <button class="photo-del" onclick="eliminarFotoTempCreacion(${idx})" title="Borrar foto">✕</button>
          </div>
        `).join("");
      }
    }

    async function guardarCreacion(idEditar) {
      const denom = document.getElementById("cr_denom").value.trim();
      if (!denom) {
        alert("Por favor ingresa al menos la denominación o nombre del equipo.");
        return;
      }

      const ut = document.getElementById("cr_ut").value.trim();
      const tag = document.getElementById("cr_tag").value.trim();
      const obs = document.getElementById("cr_obs").value.trim();
      const est = document.getElementById("filterEstacion").value;
      const ahora = new Date();

      const id = idEditar || `CREA-${Date.now()}`;
      const existente = idEditar ? creacionesNuevas[idEditar] : null;

      const registro = {
        id,
        estacion: existente?.estacion || (est === "TODAS" ? "General" : est),
        ut,
        tag,
        denominacion: denom,
        observaciones: obs,
        fecha: existente?.fecha || (ahora.toLocaleDateString("es-CO") + " " + ahora.toLocaleTimeString("es-CO", { hour: "2-digit", minute: "2-digit" })),
        inspector: document.getElementById("inspectorName").value.trim() || "Rodrigo",
        fotos: existente ? existente.fotos : [...fotosTemporalesCreacion]
      };

      creacionesNuevas[id] = registro;
      fotosTemporalesCreacion = [];
      await guardarEnStore("creaciones", registro);
      actualizarBotonCreaciones();
      abrirPanelCreaciones();
    }

    async function eliminarFotoCreacion(id, index) {
      if (!confirm("¿Eliminar esta foto?")) return;
      creacionesNuevas[id].fotos.splice(index, 1);
      await guardarEnStore("creaciones", creacionesNuevas[id]);
      abrirPanelCreaciones(id);
    }

    async function borrarCreacion(id) {
      if (!confirm("¿Eliminar por completo este registro de creación?")) return;
      delete creacionesNuevas[id];
      await eliminarDeStore("creaciones", id);
      actualizarBotonCreaciones();
      abrirPanelCreaciones();
    }

    function expandirTodo(abrir) {
      document.querySelectorAll(".children").forEach(el => abrir ? el.classList.add("open") : el.classList.remove("open"));
      document.querySelectorAll(".node-row").forEach(row => {
        const toggle = row.querySelector(".toggle");
        if (toggle.textContent !== "•") toggle.textContent = abrir ? "▼" : "▶";
      });
    }

    // ==========================================
    // 6. EXPORTACIÓN A ZIP (EXCEL + SUBCARPETAS SAP)
    // ==========================================
    function limpiarNombreCarpeta(str, maxLen = 45) {
      return String(str || "SIN_NOMBRE")
        .replace(/[\\/:*?"<>|]/g, "_")
        .replace(/\s+/g, " ")
        .trim()
        .substring(0, maxLen)
        .trim();
    }

    function construirRutaCarpetasUT(utId, mapUTRaw) {
      const ruta = [];
      const visitados = new Set();
      let actualId = String(utId || "").trim();

      while (actualId && !visitados.has(actualId)) {
        visitados.add(actualId);
        ruta.unshift(limpiarNombreCarpeta(actualId, 45));
        const utObj = mapUTRaw[actualId];
        actualId = utObj ? String(utObj["Ubicación técnica superior"] || "").trim() : "";
      }

      return ruta.length > 0 ? ruta : ["SIN_UBICACION_TECNICA"];
    }

    async function exportarJornadaZIP() {
      if (typeof JSZip === "undefined" || typeof XLSX === "undefined") {
        alert("Las librerías de exportación aún no están cargadas. Conéctate a internet una vez y recarga la página.");
        return;
      }

      const mapUTRaw = {};
      rawUT.forEach(u => {
        const id = String(u["Ubicación técnica"] || "").trim();
        if (id) mapUTRaw[id] = u;
      });

      const estSeleccionada = document.getElementById("filterEstacion").value;
      const equiposExportar = estSeleccionada === "TODAS"
        ? rawEQ
        : rawEQ.filter(e => e._estacionNorm === estSeleccionada);

      const zip = new JSZip();
      const fechaHoy = new Date().toISOString().slice(0, 10);
      const etiquetaEst = estSeleccionada === "TODAS"
        ? "Todas_Estaciones"
        : limpiarNombreCarpeta(estSeleccionada, 35);
      const carpetaFotosRoot = zip.folder("Evidencia_Fotografica");

      const filasExcel = [];

      equiposExportar.forEach(eq => {
        const id = String(eq["Equipo"] || "").trim();
        if (!id) return;

        const denom = eq["Denominación de objeto técnico"] || "Sin_Denominacion";
        const ut = String(eq["Ubicación técnica"] || "").trim() || "SIN_UBICACION_TECNICA";
        const estacionEQ = eq._estacionNorm || "General / Sin Estación";
        const reg = registrosCampo[id] || {};

        const estado = reg.estado || "PENDIENTE";
        const numFotos = (reg.fotos || []).length;

        filasExcel.push({
          "Estación": estacionEQ,
          "Ubicación Técnica": ut,
          "Equipo SAP": id,
          "Denominación": denom,
          "Equipo Superior": eq["Equipo superior"] || "",
          "Troncal": eq["Troncal"] || "",
          "Criticidad": eq["Criticidad"] || "",
          "Estado Levantamiento": estado,
          "Fecha y Hora": reg.fecha || "",
          "Inspector": reg.inspector || "",
          "Cantidad Fotos": numFotos,
          "Observaciones": reg.observaciones || ""
        });

        if (numFotos > 0) {
          let carpetaActual = carpetaFotosRoot.folder(limpiarNombreCarpeta(estacionEQ, 35));
          const nivelesUT = construirRutaCarpetasUT(ut, mapUTRaw);

          nivelesUT.forEach(nivel => {
            carpetaActual = carpetaActual.folder(nivel);
          });

          const nombreCarpetaEQ = limpiarNombreCarpeta(`${id} - ${denom}`, 35);
          const folderEQ = carpetaActual.folder(nombreCarpetaEQ);

          (reg.fotos || []).forEach((dataUrl, i) => {
            const base64Data = dataUrl.split(",")[1];
            folderEQ.file(`${limpiarNombreCarpeta(id, 20)}_F${i + 1}.jpg`, base64Data, { base64: true });
          });
        }
      });

      const listaCreaciones = Object.values(creacionesNuevas).filter(cr =>
        estSeleccionada === "TODAS" || cr.estacion === estSeleccionada
      );
      const filasCreaciones = [];

      if (listaCreaciones.length > 0) {
        const carpetaCreaciones = carpetaFotosRoot.folder("_CREACIONES_NUEVAS");

        listaCreaciones.forEach((cr, idx) => {
          const numFotos = (cr.fotos || []).length;
          const estacionCr = cr.estacion || "General / Sin Estación";
          const utCr = String(cr.ut || "").trim() || "SIN_UT";

          filasCreaciones.push({
            "ID Temporal": cr.id,
            "Estación": estacionCr,
            "Ubicación Técnica Padre": utCr,
            "TAG Físico": cr.tag || "",
            "Denominación Equipo": cr.denominacion,
            "Fecha y Hora": cr.fecha,
            "Inspector": cr.inspector,
            "Cantidad Fotos": numFotos,
            "Observaciones / Datos de Placa": cr.observaciones || ""
          });

          if (numFotos > 0) {
            let carpetaCrActual = carpetaCreaciones.folder(limpiarNombreCarpeta(estacionCr, 35));
            const nivelesUTCr = construirRutaCarpetasUT(utCr, mapUTRaw);

            nivelesUTCr.forEach(nivel => {
              carpetaCrActual = carpetaCrActual.folder(nivel);
            });

            const baseTag = cr.tag || `NUEVO_${idx + 1}`;
            const nombreCarpetaNuevo = limpiarNombreCarpeta(`${baseTag} - ${cr.denominacion}`, 35);
            const folderNuevo = carpetaCrActual.folder(nombreCarpetaNuevo);

            cr.fotos.forEach((dataUrl, i) => {
              const base64Data = dataUrl.split(",")[1];
              folderNuevo.file(`${limpiarNombreCarpeta(baseTag, 20)}_F${i + 1}.jpg`, base64Data, { base64: true });
            });
          }
        });
      }

      const wb = XLSX.utils.book_new();
      const ws = XLSX.utils.json_to_sheet(filasExcel);
      XLSX.utils.book_append_sheet(wb, ws, "Levantamiento_SAP");

      if (filasCreaciones.length > 0) {
        const wsCreaciones = XLSX.utils.json_to_sheet(filasCreaciones);
        XLSX.utils.book_append_sheet(wb, wsCreaciones, "Creaciones_Nuevas");
      }

      const excelBuffer = XLSX.write(wb, { bookType: "xlsx", type: "array" });

      zip.file(`Reporte_${etiquetaEst}_${fechaHoy}.xlsx`, excelBuffer);
      zip.file(`Respaldo_Datos_${etiquetaEst}_${fechaHoy}.json`, JSON.stringify({ registrosCampo, creacionesNuevas }, null, 2));

      const blob = await zip.generateAsync({ type: "blob" });
      const link = document.createElement("a");
      link.href = URL.createObjectURL(blob);
      link.download = `Levantamiento_${etiquetaEst}_${fechaHoy}.zip`;
      link.click();
    }

    let searchTimer;
    document.getElementById("searchInput").addEventListener("input", () => {
      clearTimeout(searchTimer);
      searchTimer = setTimeout(renderizarArbol, 200);
    });
    document.getElementById("filterEstacion").addEventListener("change", aplicarCambioEstacion);
    document.getElementById("filterUT").addEventListener("change", renderizarArbol);
    document.getElementById("filterEstado").addEventListener("change", renderizarArbol);
    document.getElementById("filterEvidencia").addEventListener("change", renderizarArbol);
    document.getElementById("filterTroncal").addEventListener("change", renderizarArbol);
    document.getElementById("filterCriticidad").addEventListener("change", renderizarArbol);

    cargarDatos(false);
  </script>
</body>
